version: "3.8"

services:
  # ============================================================================
  # FRONTEND (DEV)
  # ============================================================================
  
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WEB_BUILDER_SERVICE_URL: ${VITE_WEB_BUILDER_SERVICE_URL}
        VITE_IMAGINATIVE_SERVICE_URL: ${VITE_IMAGINATIVE_SERVICE_URL}
        VITE_SYSTEM_BASE_DOMAIN: ${VITE_SYSTEM_BASE_DOMAIN}
        VITE_SYSTEM_IP: ${VITE_SYSTEM_IP}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: startup-ninja-frontend-dev
    restart: always
    # Ports removed - accessed via nginx-proxy (backend network)
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_SYSTEM_IP=54.152.247.90
    networks:
      - backend_shared-network

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  backend_shared-network:
    external: true
    name: startup_ninja_backend_shared-network
