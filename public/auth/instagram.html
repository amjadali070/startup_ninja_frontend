<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram OAuth Callback</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: linear-gradient(45deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D, #F56040, #F77737, #FCAF45, #FFDC80);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      color: #fff;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .box {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      color: #fff;
    }
    .ig-icon {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
      border-radius: 8px;
      position: relative;
    }
    .ig-icon::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border: 2px solid white;
      border-radius: 4px;
    }
    .ig-icon::after {
      content: '';
      position: absolute;
      top: 8px;
      right: 8px;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="ig-icon"></div>
    <div class="spinner"></div>
    <h2>Completing Instagram authentication…</h2>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      const errorDescription = params.get('error_description');

      // Handle user denying access
      if (error) {
        let errorMessage = 'Instagram authorization failed';
        
        if (error === 'access_denied') {
          errorMessage = 'Access denied by user to Instagram account';
        } else if (errorDescription) {
          errorMessage = decodeURIComponent(errorDescription);
        }

        if (window.opener) {
          window.opener.postMessage({ 
            type: 'INSTAGRAM_OAUTH_ERROR', 
            error: errorMessage 
          }, window.location.origin);
        }
        window.close();
        return;
      }

      // Handle successful authorization
      if (code) {
        if (window.opener) {
          window.opener.postMessage({ 
            type: 'INSTAGRAM_OAUTH_SUCCESS', 
            code: code 
          }, window.location.origin);
        }
        window.close();
        return;
      }

      // Handle missing parameters
      if (window.opener) {
        window.opener.postMessage({ 
          type: 'INSTAGRAM_OAUTH_ERROR', 
          error: 'Missing OAuth parameters from Instagram' 
        }, window.location.origin);
      }
      window.close();
    });
  </script>
</body>
</html>
