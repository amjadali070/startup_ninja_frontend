<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook OAuth Callback</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: linear-gradient(45deg, #1877F2, #42A5F5);
      color: #fff;
      overflow: hidden;
    }
    .box {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Completing Facebook authentication…</h2>
    <p>Please wait, you will be redirected shortly.</p>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const error = params.get('error');
      const error_reason = params.get('error_reason');
      const error_description = params.get('error_description');

      if (window.opener) {
        if (code) {
          window.opener.postMessage({
            type: 'FACEBOOK_OAUTH_SUCCESS',
            code: code
          }, window.location.origin);
        } else if (error) {
          let errorMessage = 'Facebook authorization failed.';
          if (error_reason === 'user_denied') {
            errorMessage = 'You denied access to your Facebook account.';
          } else if (error_description) {
            errorMessage = error_description;
          }
          window.opener.postMessage({
            type: 'FACEBOOK_OAUTH_ERROR',
            error: errorMessage
          }, window.location.origin);
        } else {
          window.opener.postMessage({
            type: 'FACEBOOK_OAUTH_ERROR',
            error: 'Missing authorization code or error from Facebook.'
          }, window.location.origin);
        }
      }
      window.close();
    });
  </script>
</body>
</html>
