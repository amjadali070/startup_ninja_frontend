<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter OAuth Callback</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #000;
      color: #fff;
    }
    .box {
      text-align: center;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #333;
      border-top: 4px solid #1DA1F2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
      color: #1DA1F2;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Completing Twitter authentication…</h2>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const oauth_token = params.get('oauth_token');
      const oauth_verifier = params.get('oauth_verifier');
      const denied = params.get('denied');

      // Handle user denying access
      if (denied) {
        if (window.opener) {
          window.opener.postMessage({ 
            type: 'TWITTER_OAUTH_ERROR', 
            error: 'User denied access to Twitter account' 
          }, window.location.origin);
        }
        window.close();
        return;
      }

      // Handle successful authorization
      if (oauth_token && oauth_verifier) {
        if (window.opener) {
          window.opener.postMessage({ 
            type: 'TWITTER_OAUTH_SUCCESS', 
            oauth_token: oauth_token, 
            oauth_verifier: oauth_verifier 
          }, window.location.origin);
        }
        window.close();
        return;
      }

      // Handle missing parameters
      if (window.opener) {
        window.opener.postMessage({ 
          type: 'TWITTER_OAUTH_ERROR', 
          error: 'Missing OAuth parameters from Twitter' 
        }, window.location.origin);
      }
      window.close();
    });
  </script>
</body>
</html>
