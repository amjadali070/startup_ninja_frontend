version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api}
        - VITE_WEB_BUILDER_SERVICE_URL=${VITE_WEB_BUILDER_SERVICE_URL:-http://localhost:3004}
        - VITE_IMAGINATIVE_SERVICE_URL=${VITE_IMAGINATIVE_SERVICE_URL:-http://localhost:3002}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_MICROSOFT_CLIENT_ID=${VITE_MICROSOFT_CLIENT_ID}
        - VITE_MICROSOFT_TENANT_ID=${VITE_MICROSOFT_TENANT_ID}
        - VITE_MICROSOFT_REDIRECT_URI=${VITE_MICROSOFT_REDIRECT_URI}
        - VITE_GOOGLE_FONTS_API_KEY=${VITE_GOOGLE_FONTS_API_KEY}
        - VITE_WEBSITE_BUILDER_LICENSE_KEY=${VITE_WEBSITE_BUILDER_LICENSE_KEY}
        - VITE_SYSTEM_BASE_DOMAIN=${VITE_SYSTEM_BASE_DOMAIN:-localhost}
        - VITE_SYSTEM_IP=${VITE_SYSTEM_IP:-127.0.0.1}
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: startup-ninja-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "api-gateway:host-gateway"
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge
